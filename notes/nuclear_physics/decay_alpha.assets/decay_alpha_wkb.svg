<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title description">
  <title id="title">WKB barrier for alpha decay</title>
  <desc id="description">Nuclear potential well joined to a repulsive Coulomb barrier proportional to one over r. The alpha-particle energy intersects the effective potential at the classical turning points r1 and r2.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/>
    </marker>
    <radialGradient id="alpha-sphere" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fecaca"/>
      <stop offset="55%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="680" fill="#ffffff"/>

  <polygon points="432,335 432,160.19 447,173.75 462,186.16 477,197.56 492,208.06 507,217.77 522,226.77 537,235.14 552,242.94 567,250.23 582,257.06 597,263.46 612,269.48 627,275.15 642,280.51 657,285.57 672,290.36 687,294.90 702,299.21 717,303.30 732,307.20 747,310.92 762,314.46 777,317.85 792,321.09 807,324.18 822,327.15 837,329.99 852,332.72 865,335.00" fill="#dbeafe" opacity="0.8"/>
  <rect x="110" y="465" width="322" height="85" fill="#fff7ed"/>

  <line x1="110" y1="465" x2="1120" y2="465" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="110" y1="585" x2="110" y2="70" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow)"/>

  <line x1="271" y1="335" x2="865" y2="335" stroke="#c2410c" stroke-width="3" stroke-dasharray="11 9"/>
  <line x1="432" y1="160.19" x2="432" y2="585" stroke="#64748b" stroke-width="2" stroke-dasharray="8 8"/>
  <line x1="865" y1="335" x2="865" y2="585" stroke="#64748b" stroke-width="2" stroke-dasharray="8 8"/>

  <path d="M 110 550 L 432 550 L 432 160.19" fill="none" stroke="#0f172a" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline data-function="y=465-98150/(x-110)" points="432,160.19 447,173.75 462,186.16 477,197.56 492,208.06 507,217.77 522,226.77 537,235.14 552,242.94 567,250.23 582,257.06 597,263.46 612,269.48 627,275.15 642,280.51 657,285.57 672,290.36 687,294.90 702,299.21 717,303.30 732,307.20 747,310.92 762,314.46 777,317.85 792,321.09 807,324.18 822,327.15 837,329.99 852,332.72 867,335.34 882,337.86 897,340.29 912,342.62 927,344.87 942,347.03 957,349.12 972,351.14 987,353.08 1002,354.97 1017,356.79 1032,358.55 1047,360.25 1062,361.90 1077,363.50 1092,365.05 1095,365.36" fill="none" stroke="#0f172a" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>

  <circle cx="271" cy="335" r="23" fill="url(#alpha-sphere)" stroke="#7f1d1d" stroke-width="3"/>
  <text x="271" y="346" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="600" fill="#ffffff">α</text>

  <circle cx="432" cy="335" r="6" fill="#ffffff" stroke="#64748b" stroke-width="3"/>
  <circle cx="865" cy="335" r="6" fill="#ffffff" stroke="#64748b" stroke-width="3"/>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="34" fill="#1f2937">
    <text x="45" y="88" font-style="italic">V(r)</text>
    <text x="1125" y="480" font-style="italic">r</text>
    <text x="305" y="318" fill="#c2410c">E = Qα</text>
    <text x="408" y="625" font-style="italic">r₁</text>
    <text x="841" y="625" font-style="italic">r₂</text>
    <text x="160" y="538">Nuclear well</text>
    <text x="575" y="182">Coulomb barrier</text>
    <text x="575" y="224" font-style="italic">V<tspan baseline-shift="sub">C</tspan>(r) ∝ 1/r</text>
    <text x="545" y="382" fill="#1d4ed8">classically forbidden</text>
  </g>
</svg>
