<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#244a91"/>
    </marker>
  </defs>

  <rect width="1200" height="900" fill="#ffffff"/>

  <!-- 竖直长椭球：表示轴对称形变核 -->
  <ellipse cx="500" cy="520" rx="110" ry="220" fill="#eef3fb" stroke="#244a91" stroke-width="8"/>
  <ellipse cx="500" cy="520" rx="18" ry="18" fill="#244a91"/>

  <!-- 内禀对称轴 z' -->
  <line x1="500" y1="815" x2="500" y2="105" stroke="#244a91" stroke-width="7" marker-end="url(#arrow)"/>
  <text x="525" y="118" fill="#244a91" font-family="Cambria Math, Times New Roman, serif" font-size="58" font-style="italic">z′</text>

  <!-- 椭球中心至右上方小球的相对坐标线 -->
  <line x1="500" y1="520" x2="851" y2="200" stroke="#244a91" stroke-width="7"/>
  <circle cx="875" cy="178" r="32" fill="#eef3fb" stroke="#244a91" stroke-width="7"/>

  <!-- z' 轴与相对坐标线之间的夹角 -->
  <path d="M 500 290 A 230 230 0 0 1 669 364" fill="none" stroke="#244a91" stroke-width="6"/>
  <text x="605" y="275" fill="#244a91" font-family="Cambria Math, Times New Roman, serif" font-size="58" font-style="italic">θ′</text>
</svg>
